<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" role="img"
     aria-label="convertible side profile illustration">
  <defs>
    <linearGradient id="paintconvertible" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdf35"/>
      <stop offset="42%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#645113"/>
